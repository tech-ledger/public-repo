# Le service de suivi en Protect des son arrivee : le DNS en sortie, rien en entree
apiVersion: neuvector.com/v1
kind: NvSecurityRule
metadata:
  name: nv.suivi.livraison
  namespace: livraison
spec:
  target:
    policymode: Protect
    selector:
      name: nv.suivi.livraison
      criteria:
        - key: service
          op: "="
          value: suivi.livraison
        - key: domain
          op: "="
          value: livraison
  egress:
    - action: allow
      name: suivi-vers-dns
      applications:
        - DNS
      ports: any
      selector:
        name: nv.rke2-coredns-rke2-coredns.kube-system
        criteria:
          - key: service
            op: "="
            value: rke2-coredns-rke2-coredns.kube-system
          - key: domain
            op: "="
            value: kube-system
  ingress: []
  process: []
  file: []
  process_profile:
    baseline: basic
    mode: Monitor
