# Le service de suivi des retours : un serveur web qui ne tourne pas en root
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suivi
  namespace: retours
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suivi
  template:
    metadata:
      labels:
        app: suivi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: suivi
          image: nginxinc/nginx-unprivileged:1.29.8-alpine
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: suivi
  namespace: retours
spec:
  selector:
    app: suivi
  ports:
    - port: 8080
      targetPort: 8080
