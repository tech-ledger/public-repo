# Le Secret que les controllers NeuVector lisent au premier demarrage : il doit
# exister AVANT eux, d'ou la sync wave -1.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: neuvector-secret
  namespace: neuvector
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-neuvector
  target:
    name: neuvector-secret
    template:
      data:
        fedinitcfg.yaml: |
          Cluster_Name: {{ .Values.clusterName }}
          Join_Token: {{ "{{ .join_token }}" }}
          Primary_Rest_Info:
            Server: {{ .Values.primaryServer }}
            Port: {{ .Values.primaryPort }}
          Managed_Rest_Info:
            Server: {{ .Values.managedServer }}
            Port: {{ .Values.managedPort }}
        userinitcfg.yaml: |
          always_reload: true
          users:
          - Fullname: automate
            Password: "{{ "{{ .automate_password }}" }}"
            Role: admin
  data:
    - secretKey: join_token
      remoteRef:
        key: neuvector/federation
        property: join_token
    - secretKey: automate_password
      remoteRef:
        key: neuvector/federation
        property: automate_password
