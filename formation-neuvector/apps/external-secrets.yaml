# External Secrets sur chaque cluster que NeuVector doit federer.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels:
            neuvector.techledger.io/role: managed
  template:
    metadata:
      name: 'external-secrets-{{ .name }}'
    spec:
      project: default
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 2.11.0
        helm:
          releaseName: external-secrets   # le ServiceAccount s'appelle comme la release
          valuesObject:
            installCRDs: true
      destination:
        server: '{{ .server }}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
