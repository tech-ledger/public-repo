# ---------------------------------------------------------------------------
# boutique-front — configuration NGINX
#
# Contraintes imposées par l'image nginx-unprivileged :
#   - le processus tourne en UID 101, il ne peut PAS écouter sous le port 1024
#   - aucun chemin en écriture hors /tmp
# Ces deux contraintes sont exactement celles que Kubernetes imposera au
# module 08 avec runAsNonRoot et readOnlyRootFilesystem.
# ---------------------------------------------------------------------------

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tous les chemins temporaires dans /tmp : indispensable avec
    # readOnlyRootFilesystem: true.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Logs au format JSON sur stdout : c'est ce que Loki ingérera au module 10.
    log_format json escape=json '{'
        '"heure":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"methode":"$request_method",'
        '"chemin":"$uri",'
        '"code":$status,'
        '"octets":$body_bytes_sent,'
        '"duree":$request_time,'
        '"amont":"$upstream_addr",'
        '"duree_amont":"$upstream_response_time",'
        '"agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;

    # Nom du Service de l'API. Surchargeable par variable d'environnement grâce
    # à envsubst dans docker-entrypoint.d (voir Dockerfile).
    upstream api {
        server ${API_UPSTREAM};
        keepalive 16;
    }

    server {
        # 8080 et non 80 : un processus non-root ne peut pas ouvrir un port
        # privilégié. Le Service Kubernetes fera la translation 80 → 8080.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Endpoint de probe du front lui-même. Il ne teste PAS l'API :
        # le front doit rester Ready même si l'API est en panne, sinon
        # l'utilisateur reçoit une erreur 502 du navigateur au lieu d'un
        # message d'erreur lisible.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Relais vers l'API. Le front ne connaît aucune URL absolue : tout
        # passe par la même origine, donc pas de CORS et pas de configuration
        # d'URL par environnement.
        location /api/ {
            # ATTENTION au / final : « proxy_pass http://api/ » retirerait le
            # préfixe /api/ et enverrait /produits au lieu de /api/produits.
            # Sans le / final, le chemin est transmis tel quel.
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Délais courts et volontaires : mieux vaut une erreur rapide qu'un
            # navigateur qui attend 60 s. À corréler avec les probes du module 05.
            proxy_connect_timeout 2s;
            proxy_send_timeout   10s;
            proxy_read_timeout   10s;

            # Ne PAS rejouer une écriture sur un autre backend en cas d'erreur.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # En-têtes de sécurité — repris et durcis au module 06 (Ingress).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
